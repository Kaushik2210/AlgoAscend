services:
  algoascend:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      JUDGE0_URL: ${JUDGE0_URL:-}
      JUDGE0_TOKEN: ${JUDGE0_TOKEN:-}
      JUDGE0_C_ID: ${JUDGE0_C_ID:-50}
      JUDGE0_PYTHON_ID: ${JUDGE0_PYTHON_ID:-71}
      JUDGE0_JAVA_ID: ${JUDGE0_JAVA_ID:-62}
      MENTOR_CHAT_URL: ${MENTOR_CHAT_URL:-}
      MENTOR_MODEL: ${MENTOR_MODEL:-}
      MENTOR_API_KEY: ${MENTOR_API_KEY:-}
